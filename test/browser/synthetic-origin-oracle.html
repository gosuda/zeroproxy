const hosts=["o-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.browse.localhost","o-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.browse.localhost"],ids=["A","B"],reports=new Map(),frames=[];for(let index=0;index<hosts.length;index++){const frame=document.createElement("iframe");frame.src=`http://${hosts[index]}:4173/synthetic-origin-child.html?id=${ids[index]}`;document.body.append(frame);frames.push(frame)}window.addEventListener("message",event=>{const index=hosts.findIndex(host=>event.origin===`http://${host}:4173`);if(index<0||event.source!==frames[index].contentWindow||event.data?.kind!=="synthetic-origin-ready")return;reports.set(ids[index],event.data);finish()});function finish(){if(reports.size!==2)return;let sopDenied=frames[0].contentDocument===null;try{void frames[0].contentWindow.document}catch(error){sopDenied=sopDenied&&error.name==="SecurityError"}const tests=[{id:"cross-synthetic-origin-sop",ok:sopDenied},{id:"native-storage-separated",ok:reports.get("A").stored==="A"&&reports.get("B").stored==="B"},{id:"root-worker-recovered-after-reload",ok:reports.get("A").controlled&&reports.get("B").controlled&&reports.get("A").registrationScope===`http://${hosts[0]}:4173/`&&reports.get("B").registrationScope===`http://${hosts[1]}:4173/`}];document.querySelector("#result").textContent=JSON.stringify({ok:tests.every(test=>test.ok),tests,reports:[...reports.values()]})}
