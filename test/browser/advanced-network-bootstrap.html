<!doctype html>
<meta charset="utf-8">
<title>Advanced network bootstrap</title>
<script>
(async () => {
  try {
    await navigator.serviceWorker.register("/advanced-network-plan-sw.js", { scope: "/" });
    await navigator.serviceWorker.ready;
    if (!navigator.serviceWorker.controller) await new Promise(resolve => navigator.serviceWorker.addEventListener("controllerchange", resolve, { once: true }));
    let oracleFrame = null;
    addEventListener("message", event => {
      if (event.origin !== location.origin || event.source !== oracleFrame?.contentWindow || event.data?.type !== "ADVANCED_NETWORK_RESULT") return;
      globalThis.__advancedNetworkResult = event.data.result;
    });
    globalThis.__launchAdvancedNetworkOracle = () => {
      oracleFrame?.remove();
      globalThis.__advancedNetworkResult = null;
      oracleFrame = document.createElement("iframe");
      oracleFrame.src = "/advanced-network-oracle.html";
      document.body.append(oracleFrame);
    };
    globalThis.__advancedNetworkBootstrap = { ok: true };
  } catch (error) {
    globalThis.__advancedNetworkBootstrap = { ok: false, error: `${error?.name}: ${error?.message}` };
  }
})();
</script>
