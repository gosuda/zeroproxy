[package]
name = "zp-htmltx"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
zp-shared = { workspace = true }
zp-css = { workspace = true }
zp-rewriter = { workspace = true }
thiserror = { workspace = true }
lol_html = { version = "2", default-features = false }
percent-encoding = "2.3"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "transform"
harness = false
