[package]
name = "zp-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Service Worker rewriter WASM bundle (HTML, CSS, JS, and CSP transformation).
# Transport and TLS live in `zp-kernel-bundle` so they load lazily on first
# `transportFetch` rather than blocking Service Worker activation.

[dependencies]
zp-shared = { workspace = true }
zp-rewriter = { workspace = true }
zp-css = { workspace = true }
zp-htmltx = { workspace = true }
zp-engine = { workspace = true }

swc_common = { version = "23.0.0", default-features = false }
swc_css_ast = { version = "23.0.0", default-features = false }
swc_css_parser = { version = "23.0.0", default-features = false }
swc_css_visit = { version = "23.0.0", default-features = false }
url = { version = "2.5", default-features = false }

wasm-bindgen = { workspace = true }
# Diagnostics only: the panic hook in `init()` needs `console.error` and the
# `self.__zpRustTrace` ring so a Rust panic here stops surfacing as a bare
# `RuntimeError: unreachable`.
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["console"] }
