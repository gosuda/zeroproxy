[package]
name = "zp-rewriter"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# 2026-06-08 split-bundle (c.1) Step 3: OXC-based JS rewriter dropped — the
# crates/zp-rewriter (modern OXC 0.133) is now the only OXC consumer. This
# crate is now CSS-only (SWC). Step 4 will port the CSS path to zp-bundle
# and delete this crate entirely.
[dependencies]
swc_common = { version = "23.0.0", default-features = false }
swc_css_ast = { version = "23.0.0", default-features = false }
swc_css_parser = { version = "23.0.0", default-features = false }
swc_css_visit = { version = "23.0.0", default-features = false }
url = { version = "2.5", default-features = false }
wasm-bindgen = "0.2"
