<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZeroProxy</title>
<style>
  body{font:16px system-ui,sans-serif;margin:2rem;max-width:52rem} form{display:flex;gap:.5rem} #url{flex:1;padding:.6rem} button{padding:.6rem .9rem}.err{color:#991b1b}
</style>
<h1>ZeroProxy</h1>
<p>Enter an HTTP or HTTPS URL. Target pages render through <code>/zp/p/&lt;encrypted&gt;#k=&lt;key&gt;</code> on the proxy origin.</p>
<form id="open"><input id="url" type="url" autocomplete="url" spellcheck="false" placeholder="https://example.com" required><button>Open</button></form>
<p id="status" role="status"></p>
<script src="/zp/assets/zp-core.js"></script>
<script nonce="zp">
(() => {
  'use strict';
  const status = document.getElementById('status');
  const STARTUP_RELOAD_KEY = 'zp-startup-reload-count';
  const setStatus = (text, err=false) => { status.textContent = text; status.className = err ? 'err' : ''; };
  const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
  function startupReload(reason) {
    let count = 0;
    try { count = Number(sessionStorage.getItem(STARTUP_RELOAD_KEY) || '0') || 0; } catch {}
    if (count >= 2) throw new Error(`Service Worker startup stalled: ${reason}`);
    try { sessionStorage.setItem(STARTUP_RELOAD_KEY, String(count + 1)); } catch {}
    setStatus('Restarting isolated transport...', true);
    location.reload();
    return new Promise(() => {});
  }
  async function waitForController(ms) {
    if (navigator.serviceWorker.controller) return true;
    await new Promise(resolve => {
      const done = () => { clearTimeout(timer); resolve(); };
      const timer = setTimeout(done, ms);
      navigator.serviceWorker.addEventListener('controllerchange', done, { once: true });
    });
    return !!navigator.serviceWorker.controller;
  }
  async function registerSW() {
    if (!('serviceWorker' in navigator)) throw new Error('Service Worker unavailable');
    const reg = await navigator.serviceWorker.register('/zp/sw.js', { scope: ZP.CONTROL_PREFIX, updateViaCache: 'none' });
    await navigator.serviceWorker.ready;
    if (!(await waitForController(5000))) await startupReload('service-worker-not-controlling');
    await ensureSWReady();
    try { sessionStorage.removeItem(STARTUP_RELOAD_KEY); } catch {}
    return reg;
  }
  async function ensureSWReady() {
    const deadline = Date.now() + 20000;
    let last = 'SW_NOT_READY';
    while (Date.now() < deadline) {
      if (!(await waitForController(1500))) await startupReload('service-worker-not-controlling');
      try {
        const ready = await swRequest({ type: 'ZP_ENSURE_READY' }, 6000);
        if (ready.readiness === 'READY') return ready;
        last = ready.readiness || last;
      } catch (err) {
        last = err && err.message || last;
      }
      let state = null;
      try { state = await swRequest({ type: 'ZP_STATUS' }, 1500); } catch {}
      if (state && state.readiness === 'READY') return state;
      if (startupProgressing(state)) {
        await delay(500);
        continue;
      }
      await startupReload(`service-worker-${state && state.readiness || last}`);
    }
    await startupReload('service-worker-startup-timeout');
  }
  function startupProgressing(state) {
    return state && (
      state.startupPhase === 'wasm-downloading' ||
      state.startupPhase === 'wasm-starting' ||
      state.wasmLoading === true
    );
  }
  function swRequest(message, timeoutMs=10000) {
    return new Promise((resolve, reject) => {
      const controller = navigator.serviceWorker.controller;
      if (!controller) { reject(new Error('SW_NO_CONTROLLER')); return; }
      const channel = new MessageChannel();
      const timer = setTimeout(() => {
        try { channel.port1.close(); } catch {}
        reject(new Error('SW_MESSAGE_TIMEOUT'));
      }, timeoutMs);
      channel.port1.onmessage = e => {
        clearTimeout(timer);
        try { channel.port1.close(); } catch {}
        e.data && e.data.ok ? resolve(e.data) : reject(new Error(e.data && e.data.error || 'SW_NOT_READY'));
      };
      controller.postMessage(message, [channel.port2]);
    });
  }
  function proxyOrigin() {
    const u = new URL(location.href);
    if (u.hostname === 'proxy.localhost') return u.origin;
    if (u.hostname === 'localhost' || u.hostname === '127.0.0.1' || u.hostname === '::1') {
      u.hostname = 'proxy.localhost';
      return u.origin;
    }
    return u.origin;
  }
  function enterControlledScope() {
    if (location.pathname.startsWith(ZP.CONTROL_PREFIX)) return true;
    location.replace(ZP.CONTROL_PREFIX + location.search + location.hash);
    return false;
  }
  function relayOptions() {
    return { allowLoopbackWS: ZP.isLoopbackHost(location.hostname), origin: proxyOrigin() };
  }
  async function openTarget(targetUrl) {
    const target = ZP.canonicalTargetURL(targetUrl).href;
    const share = await ZP.encryptShareURL(target);
    let servers = ZP.parseRelayServersFromFragment(location.hash, relayOptions());
    try {
      const result = await swRequest({ type: 'ZP_OPEN_SHARE', routeKey: share.encrypted, targetUrl: share.targetUrl, servers });
      if (Array.isArray(result.servers) && result.servers.length) servers = result.servers;
    } catch {}
    location.assign(proxyOrigin() + ZP.makeSharePath(share.encrypted) + ZP.makeShareFragment(share.key, servers));
  }
  async function handleShare() {
    if (!ZP.isSharePath(location.pathname)) return false;
    const encrypted = ZP.shareRouteKey(location.pathname);
    const params = new URLSearchParams(location.hash.startsWith('#') ? location.hash.slice(1) : location.hash);
    const key = params.get('k');
    let servers = ZP.parseRelayServersFromFragment(location.hash, relayOptions());
    if (!key) { location.replace(ZP.errorPath('INVALID_SHARE_LINK')); return true; }
    try {
      const targetUrl = await ZP.decryptShareURL(encrypted, key);
      const result = await swRequest({ type: 'ZP_OPEN_SHARE', routeKey: encrypted, targetUrl, servers });
      if (Array.isArray(result.servers) && result.servers.length) servers = result.servers;
      const next = result.path + ZP.makeShareFragment(key, servers);
      if (location.pathname === result.path) {
        try { history.replaceState(null, '', ZP.CONTROL_PREFIX); } catch {}
      }
      location.replace(next);
    } catch (e) {
      const code = e && e.code || e && e.message || 'INVALID_SHARE_LINK';
      location.replace(ZP.errorPath(code));
    }
    return true;
  }
  document.getElementById('open').addEventListener('submit', async ev => {
    ev.preventDefault();
    try { setStatus('Opening through ZeroProxy…'); await openTarget(document.getElementById('url').value); }
    catch (e) { setStatus(e.message || 'Unable to open target', true); }
  });
  (async () => { try { setStatus('Preparing isolated transport…'); if (!enterControlledScope()) return; await registerSW(); if (!(await handleShare())) setStatus('Ready.'); } catch (e) { setStatus(e.message || 'Startup failed', true); } })();
})();
</script>
